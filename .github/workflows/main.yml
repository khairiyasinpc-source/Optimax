
name: Deploy OPTIMAX Website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: "./optimax-visual-editor-v2-github (2)/optimax-website"
        run: npm install

      - name: Build website
        working-directory: "./optimax-visual-editor-v2-github (2)/optimax-website"
        run: npm run build -- --base=/Optimax/

      - name: Include colourful homepage preview
        run: |
          mkdir -p "./optimax-visual-editor-v2-github (2)/optimax-website/dist/colourful-homepage"
          cp -R colourful-homepage/. "./optimax-visual-editor-v2-github (2)/optimax-website/dist/colourful-homepage/"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./optimax-visual-editor-v2-github (2)/optimax-website/dist"

      - name: Deploy website
        uses: actions/deploy-pages@v4
